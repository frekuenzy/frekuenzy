name: Update Ezoic ads.txt

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  update-ads-txt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch ads.txt from Ezoic
        run: |
          # Fetch the ads.txt content
          HTTP_CODE=$(curl -sL -o /tmp/ads_new.txt -w "%{http_code}" https://srv.adstxtmanager.com/19390/frekuenzy.com)
          FILE_SIZE=$(wc -c < /tmp/ads_new.txt | tr -d ' ')

          echo "HTTP Status: $HTTP_CODE"
          echo "File size: $FILE_SIZE bytes"

          # Only update if response is valid (HTTP 200 and content > 10 bytes)
          if [ "$HTTP_CODE" = "200" ] && [ "$FILE_SIZE" -gt 10 ]; then
            cp /tmp/ads_new.txt ads.txt
            echo "✅ ads.txt updated successfully ($FILE_SIZE bytes)"
          else
            echo "⚠️ Skipping update - invalid response (HTTP: $HTTP_CODE, Size: $FILE_SIZE bytes)"
            exit 0
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet ads.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ads.txt
          git commit -m "chore: auto-update Ezoic ads.txt"
          git push
